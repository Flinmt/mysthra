services:
  mysthra:
    build: .
    container_name: mysthra-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MASTER_PASSWORD=${MASTER_PASSWORD:?Set MASTER_PASSWORD before starting Mysthra}
      - PUBLIC_READ=${PUBLIC_READ:-false}
